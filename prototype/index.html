<!DOCTYPE html>
<html lang="zh-CN" data-theme="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记账簿 · 个人财务分析仪表盘 · 高保真原型</title>
<meta name="description" content="个人财务分析仪表盘高保真交互原型，含玫瑰粉与天青蓝两套主题、组件规范与状态映射。">
<style>
/* ===== 01 tokens ===== */
/* ============================================================
   01 · Design Tokens — 双主题（玫瑰粉 / 天青蓝）
   语义层变量在此定义，组件层只消费语义变量，不直写色值。
   ============================================================ */

:root {
  /* ---- 字体族 ---- */
  --font-ui: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Hiragino Sans GB",
             system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Bahnschrift", "DIN Alternate", "HarmonyOS Sans SC", "PingFang SC",
              "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", "SFMono-Regular", Consolas, monospace;

  /* ---- 字号（模块化比例 1.2 / 显示级 1.25） ---- */
  --t-2xs: 11px;
  --t-xs: 12px;
  --t-sm: 13px;
  --t-md: 14px;
  --t-lg: 16px;
  --t-xl: 19px;
  --t-2xl: 23px;
  --t-3xl: 28px;
  --t-4xl: 34px;
  --t-5xl: 42px;

  /* ---- 字重 ---- */
  --w-reg: 400;
  --w-med: 500;
  --w-semi: 600;
  --w-bold: 700;

  /* ---- 间距（4px 基准，含 6/10 中间值用于精细对齐） ---- */
  --s-1: 4px;
  --s-2: 6px;
  --s-3: 8px;
  --s-4: 10px;
  --s-5: 12px;
  --s-6: 16px;
  --s-7: 20px;
  --s-8: 24px;
  --s-9: 28px;
  --s-10: 32px;
  --s-11: 40px;
  --s-12: 48px;
  --s-13: 64px;

  /* ---- 圆角 ---- */
  --r-xs: 6px;
  --r-sm: 9px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-2xl: 26px;
  --r-pill: 999px;

  /* ---- 动效 ---- */
  --dur-1: 110ms;
  --dur-2: 180ms;
  --dur-3: 300ms;
  --dur-4: 480ms;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);

  /* ---- 财务语义（两套主题共用色相，仅微调浓度） ---- */
  --fin-up: #c63c33;          /* 支出增加 / 结余减少 = 不利（国内习惯：红，白底 5.1:1） */
  --fin-up-soft: #fbeae8;
  --fin-down: #17795b;        /* 支出减少 / 结余增加 = 有利（国内习惯：绿，白底 5.4:1） */
  --fin-down-soft: #e6f5ef;

  /* ---- 布局 ---- */
  --rail-w: 232px;
  --top-h: 66px;
  --content-max: 1360px;
}

/* ============================================================
   主题 A · 玫瑰粉「少女感」
   性格：温柔、轻盈、被照顾的感觉；不用高饱和玫红，用灰玫瑰压住甜度，
        辅以蜜桃与藕荷，避免廉价粉。
   ============================================================ */
:root,
[data-theme="pink"] {
  color-scheme: light;

  /* 品牌 */
  --primary: #d03f6b;             /* 填充色：与白字 4.54:1，AA 正文达标 */
  --primary-hover: #bc355f;
  --primary-active: #a52c52;
  --primary-ink: #a62f55;         /* 浅底上的品牌色文字（AA 6.9:1） */
  --primary-soft: #fce8ee;
  --primary-softer: #fef3f6;
  --primary-line: #f5c8d5;
  --on-primary: #ffffff;

  /* 辅助 */
  --accent: #e0913f;              /* 蜜桃 */
  --accent-soft: #fbf0e2;
  --accent-ink: #a4642c;
  --violet: #8d7ad4;
  --violet-soft: #f0edfb;

  /* 中性 · 文字 */
  --text-1: #3a2930;
  --text-2: #6b5159;
  --text-3: #806670;
  --text-4: #b09aa3;

  /* 中性 · 表面 */
  --bg: #fdf5f7;
  --bg-wash-1: rgba(231, 90, 133, 0.10);
  --bg-wash-2: rgba(231, 154, 92, 0.10);
  --bg-wash-3: rgba(141, 122, 212, 0.08);
  --dot: rgba(171, 53, 87, 0.055);
  --surface: #ffffff;
  --surface-2: #fffafb;
  --surface-3: #fdf1f5;
  --surface-inv: #3a2930;

  /* 中性 · 描边 */
  --border: #f3e1e6;
  --border-2: #e8cdd6;
  --border-3: #d9b2bf;

  /* 阴影（带品牌色温的暖影，不用纯黑） */
  --shadow-1: 0 1px 2px rgba(122, 55, 79, 0.05);
  --shadow-2: 0 1px 2px rgba(122, 55, 79, 0.04), 0 10px 24px -16px rgba(122, 55, 79, 0.26);
  --shadow-3: 0 2px 4px rgba(122, 55, 79, 0.05), 0 24px 56px -28px rgba(122, 55, 79, 0.34);
  --ring: 0 0 0 3px rgba(208, 63, 107, 0.22);

  /* 图表 */
  --chart-1: #d03f6b;
  --chart-2: #e0913f;
  --chart-3: #8d7ad4;
  --chart-4: #5aa9d6;
  --chart-5: #62bfa1;
  --chart-6: #e8bf5e;
  --chart-7: #d4829c;
  --chart-8: #93a6c9;
  --grid: rgba(58, 41, 48, 0.07);
  --axis: #bda7b0;

  /* 状态 */
  --ok: #17795a;
  --ok-soft: #e6f5ef;
  --warn: #8a600c;
  --warn-soft: #fbf2de;
  --danger: #bc3a2e;
  --danger-soft: #fcebe9;
  --info: #ab3557;
  --info-soft: #fce8ee;

  /* 遮罩 / 玻璃 */
  --overlay: rgba(58, 33, 43, 0.34);
  --glass: rgba(255, 255, 255, 0.72);
  --rail-bg: rgba(255, 255, 255, 0.62);
  --rail-active: #ffffff;
  --topbar-bg: rgba(253, 245, 247, 0.80);
}

/* ============================================================
   主题 B · 天青蓝「自然清新」
   性格：透气、克制、有秩序；用天青 + 薄荷，中性色偏冷青，
        避免 SaaS 常见的亮蓝紫渐变。
   ============================================================ */
[data-theme="sky"] {
  color-scheme: light;

  --primary: #2d7ab2;             /* 填充色：与白字 4.65:1，AA 正文达标 */
  --primary-hover: #256ba1;
  --primary-active: #1d5c8c;
  --primary-ink: #1d5f92;
  --primary-soft: #e2eff9;
  --primary-softer: #f0f8fd;
  --primary-line: #bfdcf0;
  --on-primary: #ffffff;

  --accent: #3fae97;
  --accent-soft: #e3f5f0;
  --accent-ink: #1f7d69;
  --violet: #7a8fd6;
  --violet-soft: #ecf0fb;

  --text-1: #1c2c38;
  --text-2: #4a6272;
  --text-3: #607684;
  --text-4: #9db3c1;

  --bg: #f4fafd;
  --bg-wash-1: rgba(61, 142, 201, 0.11);
  --bg-wash-2: rgba(63, 174, 151, 0.10);
  --bg-wash-3: rgba(122, 143, 214, 0.07);
  --dot: rgba(29, 99, 152, 0.06);
  --surface: #ffffff;
  --surface-2: #f9fcfe;
  --surface-3: #eef6fb;
  --surface-inv: #1c2c38;

  --border: #dfeaf2;
  --border-2: #c8dbe8;
  --border-3: #aec9db;

  --shadow-1: 0 1px 2px rgba(23, 64, 94, 0.05);
  --shadow-2: 0 1px 2px rgba(23, 64, 94, 0.04), 0 10px 24px -16px rgba(23, 64, 94, 0.22);
  --shadow-3: 0 2px 4px rgba(23, 64, 94, 0.05), 0 24px 56px -28px rgba(23, 64, 94, 0.30);
  --ring: 0 0 0 3px rgba(46, 124, 182, 0.24);

  --chart-1: #2e7cb6;
  --chart-2: #3fae97;
  --chart-3: #7a8fd6;
  --chart-4: #e0a25b;
  --chart-5: #4fbfd3;
  --chart-6: #8ac47c;
  --chart-7: #b08bd4;
  --chart-8: #dc8391;
  --grid: rgba(28, 44, 56, 0.07);
  --axis: #a6bcca;

  --ok: #17795b;
  --ok-soft: #e4f4ee;
  --warn: #8a600c;
  --warn-soft: #faf1dc;
  --danger: #bc3a2e;
  --danger-soft: #fbeae7;
  --info: #1d6398;
  --info-soft: #e2eff9;

  --overlay: rgba(18, 42, 58, 0.34);
  --glass: rgba(255, 255, 255, 0.74);
  --rail-bg: rgba(255, 255, 255, 0.64);
  --rail-active: #ffffff;
  --topbar-bg: rgba(244, 250, 253, 0.82);
}

/* ===== 02 base ===== */
/* ============================================================
   02 · Base + 应用外壳 + 组件层
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--t-md);
  line-height: 1.55;
  color: var(--text-1);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color var(--dur-4) var(--ease), color var(--dur-3) var(--ease);
}

/* 环境层：两团柔光 + 极淡点阵（账本纸感），主题切换时缓慢呼吸 */
body::before,
body::after {
  content: "";
  position: fixed;
  z-index: 0;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(10px);
  transition: background var(--dur-4) var(--ease), opacity var(--dur-4) var(--ease);
}
body::before {
  width: 780px; height: 780px;
  top: -380px; left: -180px;
  background: radial-gradient(circle at 40% 40%, var(--bg-wash-1), transparent 68%);
}
body::after {
  width: 720px; height: 720px;
  bottom: -420px; right: -160px;
  background: radial-gradient(circle at 50% 50%, var(--bg-wash-2), transparent 70%);
}

h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
a { color: var(--primary-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-xs); }
::selection { background: var(--primary-soft); color: var(--primary-ink); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: var(--border-2);
  border-radius: var(--r-pill);
  border: 3px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--border-3); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.015em; }
.mono { font-family: var(--font-mono); font-size: 0.94em; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- 外壳 ---------- */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------- 左侧导航 ---------- */
.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: var(--s-7);
  padding: var(--s-7) var(--s-5) var(--s-6);
  background: var(--rail-bg);
  backdrop-filter: blur(18px) saturate(1.2);
  border-right: 1px solid var(--border);
  transition: background var(--dur-4) var(--ease), border-color var(--dur-3) var(--ease);
}

.brand { display: flex; align-items: center; gap: var(--s-4); padding: 0 var(--s-3); }
.brand__mark {
  position: relative;
  width: 34px; height: 34px;
  border-radius: 11px;
  display: grid; place-items: center;
  color: var(--on-primary);
  background: linear-gradient(150deg, var(--primary) 8%, var(--accent) 120%);
  box-shadow: 0 6px 16px -8px var(--primary), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  font-family: var(--font-num);
  font-size: 17px;
  font-weight: 600;
}
.brand__mark::after {
  content: "";
  position: absolute; inset: 0;
  border-radius: inherit;
  border: 1px solid rgba(255, 255, 255, 0.28);
}
.brand__text { min-width: 0; }
.brand__name { font-size: var(--t-md); font-weight: var(--w-semi); letter-spacing: 0.01em; }
.brand__sub {
  font-size: var(--t-2xs);
  color: var(--text-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.nav { display: flex; flex-direction: column; gap: var(--s-6); overflow-y: auto; flex: 1; padding-bottom: var(--s-2); }
.nav__group { display: flex; flex-direction: column; gap: 2px; }
.nav__label {
  padding: 0 var(--s-4) var(--s-2);
  font-size: 10.5px;
  font-weight: var(--w-semi);
  letter-spacing: 0.16em;
  color: var(--text-4);
}
.nav__item {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--s-4);
  width: 100%;
  padding: 8px var(--s-4);
  border: 0;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  font-size: var(--t-sm);
  cursor: pointer;
  text-align: left;
  transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
}
.nav__item svg { flex: none; opacity: 0.78; transition: opacity var(--dur-2); }
.nav__item:hover { background: var(--surface-3); color: var(--text-1); }
.nav__item:hover svg { opacity: 1; }
.nav__item[aria-current="page"] {
  background: var(--rail-active);
  color: var(--primary-ink);
  font-weight: var(--w-med);
  box-shadow: var(--shadow-2);
}
.nav__item[aria-current="page"] svg { opacity: 1; color: var(--primary); }
.nav__item[aria-current="page"]::before {
  content: "";
  position: absolute;
  left: -5px; top: 50%;
  width: 3px; height: 16px;
  border-radius: var(--r-pill);
  background: var(--primary);
  transform: translateY(-50%);
}
.nav__badge {
  margin-left: auto;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--r-pill);
  background: var(--primary-soft);
  color: var(--primary-ink);
  font-family: var(--font-num);
  font-size: 10.5px;
  line-height: 18px;
  text-align: center;
}

.rail__foot { display: flex; flex-direction: column; gap: var(--s-3); }
.rail__card {
  padding: var(--s-4);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-2);
  font-size: var(--t-2xs);
  color: var(--text-3);
  line-height: 1.7;
}
.rail__card b { display: block; color: var(--text-2); font-weight: var(--w-med); font-size: var(--t-xs); }
.rail__card code {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-2);
  background: var(--surface-3);
  padding: 1px 4px;
  border-radius: 4px;
}
.rail__ver { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--text-4); padding: 0 2px; }
.rail__dot { display: inline-flex; align-items: center; gap: 5px; }
.rail__dot::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft);
}

/* ---------- 主区 ---------- */
.main { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: var(--s-6);
  height: var(--top-h);
  padding: 0 var(--s-9);
  background: var(--topbar-bg);
  backdrop-filter: blur(16px) saturate(1.15);
  border-bottom: 1px solid var(--border);
  transition: background var(--dur-4) var(--ease), border-color var(--dur-3) var(--ease);
}
.topbar__crumb { display: flex; align-items: center; gap: var(--s-3); font-size: var(--t-xs); color: var(--text-3); }
.topbar__crumb b { font-weight: var(--w-med); color: var(--text-1); font-size: var(--t-sm); }
.topbar__crumb .sep { color: var(--text-4); }
.topbar__right { margin-left: auto; display: flex; align-items: center; gap: var(--s-3); }
.topbar__date { font-size: var(--t-xs); color: var(--text-3); padding-right: var(--s-2); }

.view {
  width: 100%;
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--s-9) var(--s-9) var(--s-12);
  animation: viewIn var(--dur-3) var(--ease-out);
}
@keyframes viewIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* ---------- 页头 ---------- */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--s-6);
  margin-bottom: var(--s-7);
  flex-wrap: wrap;
}
.page-head__title {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  font-size: var(--t-2xl);
  font-weight: var(--w-semi);
  letter-spacing: -0.015em;
  line-height: 1.25;
}
.page-head__sub { margin-top: 5px; font-size: var(--t-sm); color: var(--text-3); max-width: 62ch; }
.page-head__actions { display: flex; align-items: center; gap: var(--s-3); }

.section-label {
  display: flex;
  align-items: center;
  gap: var(--s-3);
  font-size: 11px;
  font-weight: var(--w-semi);
  letter-spacing: 0.14em;
  color: var(--text-3);
  text-transform: uppercase;
}
.section-label::before {
  content: "";
  width: 14px; height: 2px;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--primary), var(--accent));
}

/* ---------- 栅格 ---------- */
.grid { display: grid; gap: var(--s-6); }
.g-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c-3 { grid-column: span 3; } .c-4 { grid-column: span 4; } .c-5 { grid-column: span 5; }
.c-6 { grid-column: span 6; } .c-7 { grid-column: span 7; } .c-8 { grid-column: span 8; }
.c-9 { grid-column: span 9; } .c-12 { grid-column: span 12; }
.stack { display: flex; flex-direction: column; gap: var(--s-6); }
.row { display: flex; align-items: center; gap: var(--s-3); }
.row--between { justify-content: space-between; }
.spacer { flex: 1; }

/* ---------- 卡片 ---------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  transition: background var(--dur-4) var(--ease), border-color var(--dur-3) var(--ease),
              box-shadow var(--dur-3) var(--ease);
}
.card--raised { box-shadow: var(--shadow-2); }
.card--quiet { background: var(--surface-2); box-shadow: none; }
.card--flush { overflow: hidden; }
.card__head {
  display: flex;
  align-items: center;
  gap: var(--s-4);
  padding: var(--s-6) var(--s-7);
  border-bottom: 1px solid var(--border);
}
.card__head--plain { border-bottom: 0; padding-bottom: 0; }
.card__title { font-size: var(--t-md); font-weight: var(--w-semi); letter-spacing: 0.005em; }
.card__sub { font-size: var(--t-xs); color: var(--text-3); margin-top: 2px; }
.card__body { padding: var(--s-7); }
.card__foot {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-5) var(--s-7);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
  font-size: var(--t-xs);
  color: var(--text-3);
}

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s-2);
  height: 36px;
  padding: 0 var(--s-5);
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: transparent;
  font-size: var(--t-sm);
  font-weight: var(--w-med);
  white-space: nowrap;
  cursor: pointer;
  transition: background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease),
              color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease),
              transform var(--dur-1) var(--ease);
}
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.46; cursor: not-allowed; transform: none !important; box-shadow: none; }
.btn svg { flex: none; }
.btn--primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.18);
}
.btn--primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-2); transform: translateY(-1px); }
.btn--primary:active:not(:disabled) { background: var(--primary-active); transform: translateY(0); box-shadow: none; }
.btn--outline { border-color: var(--border-2); background: var(--surface); color: var(--text-1); }
.btn--outline:hover:not(:disabled) { border-color: var(--border-3); background: var(--surface-2); }
.btn--ghost { color: var(--text-2); }
.btn--ghost:hover:not(:disabled) { background: var(--surface-3); color: var(--text-1); }
.btn--soft { background: var(--primary-soft); color: var(--primary-ink); }
.btn--soft:hover:not(:disabled) { background: var(--primary-line); }
.btn--danger { background: var(--danger); color: #fff; }
.btn--danger:hover:not(:disabled) { filter: brightness(0.94); }
.btn--sm { height: 30px; padding: 0 var(--s-4); font-size: var(--t-xs); border-radius: var(--r-xs); }
.btn--lg { height: 42px; padding: 0 var(--s-7); font-size: var(--t-md); border-radius: var(--r-md); }
.btn--block { width: 100%; }
.btn--loading { pointer-events: none; color: transparent !important; position: relative; }
.btn--loading::after {
  content: "";
  position: absolute;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.45);
  border-top-color: #fff;
  animation: spin 0.7s linear infinite;
}
.btn--outline.btn--loading::after { border-color: var(--border-2); border-top-color: var(--primary); }
@keyframes spin { to { transform: rotate(360deg); } }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 34px; height: 34px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition: background var(--dur-2), color var(--dur-2), border-color var(--dur-2);
}
.icon-btn:hover { background: var(--surface-3); color: var(--text-1); }
.icon-btn--bordered { border-color: var(--border); background: var(--surface); }

/* ---------- 分段控件 ---------- */
.segmented {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--surface-3);
}
.segmented__item {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  height: 26px;
  padding: 0 var(--s-4);
  border: 0;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--text-3);
  font-size: var(--t-xs);
  font-weight: var(--w-med);
  cursor: pointer;
  transition: background var(--dur-2) var(--ease), color var(--dur-2), box-shadow var(--dur-2);
}
.segmented__item:hover { color: var(--text-1); }
.segmented__item[aria-pressed="true"] {
  background: var(--surface);
  color: var(--primary-ink);
  box-shadow: var(--shadow-1), 0 1px 3px rgba(0, 0, 0, 0.05);
}
.segmented--lg .segmented__item { height: 30px; padding: 0 var(--s-5); font-size: var(--t-sm); }

/* 主题切换器 */
.theme-switch {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--surface-3);
}
.theme-switch__item {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px;
  border: 0; border-radius: var(--r-pill);
  background: transparent;
  color: var(--text-3);
  font-size: var(--t-xs);
  font-weight: var(--w-med);
  cursor: pointer;
  transition: all var(--dur-2) var(--ease);
}
.theme-switch__item i {
  width: 9px; height: 9px; border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
  transition: transform var(--dur-2) var(--ease-out);
}
.theme-switch__item[data-theme-set="pink"] i { background: #e75a85; }
.theme-switch__item[data-theme-set="sky"] i { background: #3d8ec9; }
.theme-switch__item[aria-pressed="true"] { background: var(--surface); color: var(--text-1); box-shadow: var(--shadow-1); }
.theme-switch__item[aria-pressed="true"] i { transform: scale(1.25); }

/* ---------- 徽标 / 标签 ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 21px;
  padding: 0 var(--s-3);
  border-radius: var(--r-pill);
  font-size: var(--t-2xs);
  font-weight: var(--w-med);
  line-height: 1;
  white-space: nowrap;
  background: var(--surface-3);
  color: var(--text-2);
}
.badge::before {
  content: "";
  width: 5px; height: 5px; border-radius: 50%;
  background: currentColor;
  opacity: 0.9;
}
.badge--plain::before { display: none; }
.badge--ok { background: var(--ok-soft); color: var(--ok); }
.badge--warn { background: var(--warn-soft); color: var(--warn); }
.badge--danger { background: var(--danger-soft); color: var(--danger); }
.badge--info { background: var(--primary-soft); color: var(--primary-ink); }
.badge--neutral { background: var(--surface-3); color: var(--text-3); }
.badge--outline { background: transparent; box-shadow: inset 0 0 0 1px var(--border-2); color: var(--text-3); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  height: 30px;
  padding: 0 var(--s-4);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--text-2);
  font-size: var(--t-xs);
  cursor: pointer;
  transition: all var(--dur-2) var(--ease);
}
.chip:hover { border-color: var(--border-2); background: var(--surface-2); }
.chip[aria-pressed="true"] {
  background: var(--primary-soft);
  border-color: var(--primary-line);
  color: var(--primary-ink);
  font-weight: var(--w-med);
}
.chip--static { cursor: default; }
.chip--static:hover { background: var(--surface); border-color: var(--border); }
.chip__x { display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; color: var(--text-3); }
.chip__x:hover { background: var(--primary-line); color: var(--primary-ink); }

.delta {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-family: var(--font-num);
  font-size: var(--t-xs);
  font-weight: var(--w-med);
  font-variant-numeric: tabular-nums;
}
.delta--up, .delta--red { color: var(--fin-up); }
.delta--down, .delta--green { color: var(--fin-down); }
.delta--flat { color: var(--text-3); }
.delta__cap { font-family: var(--font-ui); font-size: 10.5px; font-weight: var(--w-reg); opacity: 0.8; }

/* ---------- 表单 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field__label { font-size: var(--t-xs); font-weight: var(--w-med); color: var(--text-2); display: flex; align-items: center; gap: 5px; }
.field__label .req { color: var(--danger); }
.field__hint { font-size: var(--t-2xs); color: var(--text-3); line-height: 1.6; }
.field__error { display: none; align-items: center; gap: 4px; font-size: var(--t-2xs); color: var(--danger); }
.field.is-invalid .field__error { display: flex; }
.field.is-invalid .input, .field.is-invalid .select__native { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }

.input, .textarea {
  width: 100%;
  height: 36px;
  padding: 0 var(--s-4);
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text-1);
  font-family: var(--font-ui);
  font-size: var(--t-sm);
  transition: border-color var(--dur-2), box-shadow var(--dur-2), background var(--dur-2);
}
.textarea { height: auto; min-height: 76px; padding: var(--s-3) var(--s-4); resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--text-4); }
.input:hover, .textarea:hover { border-color: var(--border-3); }
.input:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.input:disabled, .textarea:disabled, .input[readonly] {
  background: var(--surface-3); color: var(--text-3); cursor: not-allowed; border-color: var(--border);
}
.input--num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.input-group { position: relative; display: flex; align-items: center; }
.input-group .input { padding-left: 32px; }
.input-group__icon { position: absolute; left: 10px; color: var(--text-4); pointer-events: none; display: flex; }
.input-affix {
  position: absolute; right: 10px; font-size: var(--t-xs); color: var(--text-3); pointer-events: none;
}

.select { position: relative; }
.select__native {
  width: 100%;
  height: 36px;
  padding: 0 30px 0 var(--s-4);
  border: 1px solid var(--border-2);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--text-1);
  font-family: var(--font-ui);
  font-size: var(--t-sm);
  appearance: none;
  cursor: pointer;
  transition: border-color var(--dur-2), box-shadow var(--dur-2);
}
.select__native:hover { border-color: var(--border-3); }
.select__native:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.select::after {
  content: "";
  position: absolute;
  right: 13px; top: 50%;
  width: 6px; height: 6px;
  border-right: 1.5px solid var(--text-3);
  border-bottom: 1.5px solid var(--text-3);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}
.select--sm .select__native { height: 30px; font-size: var(--t-xs); border-radius: var(--r-xs); }

/* 开关 */
.switch {
  position: relative;
  display: inline-flex;
  flex: none;
  width: 36px; height: 20px;
  padding: 0;
  border: 1px solid var(--border-2);
  border-radius: var(--r-pill);
  background: var(--surface-3);
  cursor: pointer;
  transition: background var(--dur-2) var(--ease), border-color var(--dur-2);
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
  transition: transform var(--dur-2) var(--ease-out);
}
.switch[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.switch:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.switch:disabled { opacity: 0.45; cursor: not-allowed; }

/* 复选 / 单选 */
.checkbox, .radio {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--s-3);
  font-size: var(--t-sm);
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}
.checkbox input, .radio input { position: absolute; opacity: 0; width: 0; height: 0; }
.checkbox__box, .radio__box {
  flex: none;
  width: 16px; height: 16px;
  border: 1px solid var(--border-3);
  border-radius: 5px;
  background: var(--surface);
  display: grid; place-items: center;
  transition: all var(--dur-2) var(--ease);
}
.radio__box { border-radius: 50%; }
.checkbox input:checked + .checkbox__box { background: var(--primary); border-color: var(--primary); }
.checkbox input:checked + .checkbox__box::after {
  content: "";
  width: 8px; height: 4px;
  border-left: 1.6px solid #fff;
  border-bottom: 1.6px solid #fff;
  transform: translateY(-1px) rotate(-45deg);
}
.radio input:checked + .radio__box { border-color: var(--primary); border-width: 5px; }
.checkbox input:focus-visible + .checkbox__box,
.radio input:focus-visible + .radio__box { box-shadow: var(--ring); }
.checkbox input:disabled ~ * { opacity: 0.5; }

/* ---------- 表格 ---------- */
.table-wrap { width: 100%; overflow: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--t-sm); }
.table th {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: var(--s-4) var(--s-5);
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  color: var(--text-3);
  font-size: var(--t-2xs);
  font-weight: var(--w-semi);
  letter-spacing: 0.05em;
  text-align: left;
  white-space: nowrap;
  backdrop-filter: blur(6px);
}
.table th.is-sortable { cursor: pointer; user-select: none; }
.table th.is-sortable:hover { color: var(--text-1); }
.table th .sort-ind { display: inline-block; margin-left: 4px; color: var(--text-4); font-size: 9px; }
.table th[aria-sort="ascending"] .sort-ind, .table th[aria-sort="descending"] .sort-ind { color: var(--primary); }
.table td {
  padding: var(--s-4) var(--s-5);
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
  vertical-align: middle;
}
.table tbody tr { transition: background var(--dur-2); }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:last-child td { border-bottom: 0; }
.table .td-strong { color: var(--text-1); font-weight: var(--w-med); }
.table .td-num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.table .td-muted { color: var(--text-3); font-size: var(--t-xs); }
.table--compact td, .table--compact th { padding: 7px var(--s-4); }
.table--zebra tbody tr:nth-child(even) { background: var(--surface-2); }
.table tr.is-selected { background: var(--primary-softer) !important; box-shadow: inset 3px 0 0 var(--primary); }
.table tr.is-dup td { color: var(--text-3); }
.table-scroll { max-height: 420px; overflow: auto; }

/* 单元格内小元素 */
.cell-2line { display: flex; flex-direction: column; gap: 1px; }
.cell-2line small { font-size: var(--t-2xs); color: var(--text-4); }
.cell-tag { display: inline-flex; align-items: center; gap: 5px; }
.cell-edit {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 6px; margin: -2px -6px;
  border-radius: var(--r-xs);
  cursor: pointer;
  transition: background var(--dur-2), color var(--dur-2);
}
.cell-edit:hover { background: var(--primary-softer); color: var(--primary-ink); }
.cell-edit svg { opacity: 0; transition: opacity var(--dur-2); }
.cell-edit:hover svg { opacity: 1; }

/* ---------- 提示条 ---------- */
.notice {
  display: flex;
  align-items: flex-start;
  gap: var(--s-4);
  padding: var(--s-4) var(--s-5);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-2);
  font-size: var(--t-xs);
  color: var(--text-2);
  line-height: 1.65;
}
.notice__icon { flex: none; margin-top: 1px; }
.notice b { color: var(--text-1); font-weight: var(--w-med); }
.notice--warn { background: var(--warn-soft); border-color: rgba(182, 128, 42, 0.24); color: #7d5a15; }
.notice--warn .notice__icon { color: var(--warn); }
.notice--danger { background: var(--danger-soft); border-color: rgba(207, 68, 56, 0.22); color: #8f2b22; }
.notice--danger .notice__icon { color: var(--danger); }
.notice--info { background: var(--primary-softer); border-color: var(--primary-line); color: var(--primary-ink); }
.notice--info .notice__icon { color: var(--primary); }
.notice--ok { background: var(--ok-soft); border-color: rgba(31, 143, 102, 0.2); color: #14664a; }
.notice--ok .notice__icon { color: var(--ok); }

/* ---------- 步骤条 ---------- */
.steps { display: flex; align-items: center; gap: 0; padding: var(--s-5) var(--s-6); }
.step { display: flex; align-items: center; gap: var(--s-3); flex: none; }
.step__dot {
  display: grid; place-items: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border-2);
  background: var(--surface);
  color: var(--text-3);
  font-family: var(--font-num);
  font-size: var(--t-2xs);
  font-weight: var(--w-semi);
  transition: all var(--dur-3) var(--ease);
}
.step__label { font-size: var(--t-xs); color: var(--text-3); white-space: nowrap; }
.step--done .step__dot { background: var(--primary-soft); border-color: var(--primary-line); color: var(--primary-ink); }
.step--done .step__label { color: var(--text-2); }
.step--current .step__dot {
  background: var(--primary); border-color: var(--primary); color: #fff;
  box-shadow: 0 0 0 4px var(--primary-soft);
}
.step--current .step__label { color: var(--text-1); font-weight: var(--w-semi); }
.step__line { flex: 1; height: 1px; margin: 0 var(--s-4); background: var(--border-2); min-width: 16px; }
.step__line--done { background: var(--primary-line); }

/* ---------- 上传区 ---------- */
.dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--s-3);
  min-height: 226px;
  padding: var(--s-9) var(--s-7);
  border: 1.5px dashed var(--border-2);
  border-radius: var(--r-lg);
  background: var(--surface-2);
  text-align: center;
  cursor: pointer;
  transition: all var(--dur-2) var(--ease);
}
.dropzone:hover { border-color: var(--primary-line); background: var(--primary-softer); }
.dropzone.is-drag { border-color: var(--primary); background: var(--primary-soft); box-shadow: var(--ring); }
.dropzone__icon {
  display: grid; place-items: center;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--primary);
  box-shadow: var(--shadow-1);
}
.dropzone__title { font-size: var(--t-md); font-weight: var(--w-med); color: var(--text-1); }
.dropzone__desc { font-size: var(--t-xs); color: var(--text-3); }

/* ---------- 进度 ---------- */
.progress { height: 6px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.progress__bar {
  height: 100%;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width var(--dur-4) var(--ease);
}
.progress--sm { height: 4px; }
.progress--indeterminate .progress__bar { width: 38%; animation: indet 1.4s var(--ease-inout) infinite; }
@keyframes indet {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(300%); }
}

/* ---------- 空态 / 骨架 ---------- */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: var(--s-3); padding: var(--s-12) var(--s-7); text-align: center; }
.empty__art {
  display: grid; place-items: center;
  width: 76px; height: 76px;
  border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, var(--primary-soft), var(--surface-3));
  color: var(--primary);
  margin-bottom: var(--s-2);
}
.empty__title { font-size: var(--t-md); font-weight: var(--w-med); color: var(--text-1); }
.empty__desc { font-size: var(--t-xs); color: var(--text-3); max-width: 40ch; line-height: 1.7; }
.empty__actions { margin-top: var(--s-4); display: flex; gap: var(--s-3); }

.skeleton {
  border-radius: var(--r-sm);
  background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
}
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

/* ---------- 模态 / 抽屉 / 浮层 ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s-8);
  background: var(--overlay);
  backdrop-filter: blur(3px);
  animation: fadeIn var(--dur-2) var(--ease);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 100%;
  max-width: 560px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-3);
  overflow: hidden;
  animation: modalIn var(--dur-3) var(--ease-out);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }
.modal--sm { max-width: 460px; }
.modal--lg { max-width: 720px; }
.modal__head { display: flex; align-items: flex-start; gap: var(--s-4); padding: var(--s-7) var(--s-8) var(--s-4); }
.modal__title { font-size: var(--t-lg); font-weight: var(--w-semi); }
.modal__sub { font-size: var(--t-xs); color: var(--text-3); margin-top: 3px; line-height: 1.6; }
.modal__body { padding: var(--s-3) var(--s-8) var(--s-7); overflow-y: auto; }
.modal__foot {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--s-3);
  padding: var(--s-5) var(--s-8);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
}
.modal__foot .spacer { flex: 1; }

.drawer-overlay { align-items: stretch; justify-content: flex-end; padding: 0; }
.drawer {
  width: 100%;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-3);
  animation: drawerIn var(--dur-3) var(--ease-out);
}
@keyframes drawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer__head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-4);
  padding: var(--s-7) var(--s-7) var(--s-5);
  border-bottom: 1px solid var(--border);
}
.drawer__body { flex: 1; overflow-y: auto; padding: var(--s-7); }
.drawer__foot { padding: var(--s-5) var(--s-7); border-top: 1px solid var(--border); display: flex; gap: var(--s-3); justify-content: flex-end; background: var(--surface-2); }

.toasts { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: var(--s-3); align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: var(--s-3);
  padding: 10px var(--s-5);
  border-radius: var(--r-md);
  background: var(--surface-inv);
  color: #fff;
  font-size: var(--t-xs);
  box-shadow: var(--shadow-3);
  animation: toastIn var(--dur-3) var(--ease-out);
}
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.toast i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.toast--ok i { background: #5fd0a6; }
.toast--warn i { background: #f0c069; }

.tip {
  position: fixed;
  z-index: 150;
  pointer-events: none;
  padding: 7px 10px;
  border-radius: var(--r-sm);
  background: var(--surface);
  border: 1px solid var(--border-2);
  box-shadow: var(--shadow-2);
  font-size: var(--t-2xs);
  color: var(--text-1);
  line-height: 1.55;
  white-space: nowrap;
  opacity: 0;
  transform: translate(-50%, -120%);
  transition: opacity var(--dur-1);
}
.tip.is-on { opacity: 1; }
.tip b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---------- 分隔 / 杂项 ---------- */
.hr { height: 1px; background: var(--border); border: 0; margin: 0; }
.hr--v { width: 1px; height: 18px; background: var(--border); }
.muted { color: var(--text-3); }
.tiny { font-size: var(--t-2xs); }
.small { font-size: var(--t-xs); }
.strong { font-weight: var(--w-semi); color: var(--text-1); }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.link-btn {
  border: 0; background: transparent; padding: 0;
  color: var(--primary-ink); font-size: inherit; cursor: pointer;
  border-bottom: 1px solid transparent;
}
.link-btn:hover { border-bottom-color: currentColor; }

.kbd {
  display: inline-block; min-width: 18px; padding: 1px 5px;
  border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 5px;
  background: var(--surface-2); font-family: var(--font-mono); font-size: 10px;
  color: var(--text-3); text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ===== 03 pages ===== */
/* ============================================================
   03 · 页面级布局与专属组件
   ============================================================ */

/* ---------- 总览带（Dashboard hero） ---------- */
.overview {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.6fr);
  gap: var(--s-8);
  padding: var(--s-8);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  background:
    radial-gradient(120% 160% at 0% 0%, var(--primary-soft) 0%, transparent 58%),
    radial-gradient(110% 140% at 100% 100%, var(--accent-soft) 0%, transparent 60%),
    var(--surface);
  box-shadow: var(--shadow-2);
}
.overview::after {
  content: "";
  position: absolute;
  right: -60px; top: -90px;
  width: 260px; height: 260px;
  border-radius: 50%;
  border: 1px solid var(--primary-line);
  opacity: 0.5;
  pointer-events: none;
}
.overview__eyebrow {
  display: flex; align-items: center; gap: var(--s-3);
  font-size: var(--t-2xs);
  letter-spacing: 0.14em;
  color: var(--text-3);
  text-transform: uppercase;
}
.overview__main { display: flex; flex-direction: column; justify-content: center; gap: var(--s-2); }
.overview__label { font-size: var(--t-sm); color: var(--text-2); }
.overview__value {
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-size: var(--t-5xl);
  font-weight: var(--w-med);
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: var(--text-1);
}
.overview__value .cur { font-size: var(--t-xl); color: var(--text-3); font-weight: var(--w-reg); }
.overview__meta { display: flex; align-items: center; flex-wrap: wrap; gap: var(--s-3); margin-top: var(--s-1); }
.overview__stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--s-1) var(--s-6);
  align-content: center;
  padding-left: var(--s-8);
  border-left: 1px dashed var(--border-2);
}
.ostat { padding: var(--s-3) 0; }
.ostat__k { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--text-3); }
.ostat__v {
  display: flex; align-items: baseline; gap: 5px;
  margin-top: 2px;
  font-family: var(--font-num);
  font-size: var(--t-2xl);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--text-1);
}
.ostat__v small { font-size: var(--t-2xs); color: var(--text-4); font-family: var(--font-ui); }
.dot-k { width: 6px; height: 6px; border-radius: 50%; flex: none; }

/* ---------- KPI 卡 ---------- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-6); }
.kpi {
  position: relative;
  overflow: hidden;
  padding: var(--s-6);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  box-shadow: var(--shadow-1);
  transition: box-shadow var(--dur-3) var(--ease), transform var(--dur-3) var(--ease), border-color var(--dur-3);
}
.kpi:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); border-color: var(--border-2); }
.kpi__label { display: flex; align-items: center; gap: 6px; font-size: var(--t-xs); color: var(--text-3); }
.kpi__value {
  display: flex; align-items: baseline; gap: 3px;
  margin-top: var(--s-5);
  font-family: var(--font-num);
  font-size: var(--t-4xl);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.028em;
  line-height: 1.05;
  color: var(--text-1);
}
.kpi__value .cur { font-size: var(--t-lg); color: var(--text-3); }
.kpi__value .unit { font-size: var(--t-xl); color: var(--text-2); margin-left: 1px; }
.kpi__foot { display: flex; align-items: center; gap: var(--s-3); margin-top: var(--s-4); font-size: var(--t-2xs); color: var(--text-3); }
.kpi__spark { position: absolute; right: var(--s-5); bottom: var(--s-5); width: 92px; opacity: 0.9; }

/* 让同一行的卡片等高，图表卡内内容向上下两端分布 */
.g-fill > [class*="c-"] > .card { height: 100%; }
.g-fill .chart-card { display: flex; flex-direction: column; }
.g-fill .chart-card > .card__head { flex: none; }
.g-fill .chart-card > .card__body { flex: 1; display: flex; flex-direction: column; }
.g-fill .chart-card .chart-strip { margin-top: auto; }

/* ---------- 图表 ---------- */
.chart-card .card__body { padding: var(--s-5) var(--s-6) var(--s-6); }
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--font-num); font-size: 10px; fill: var(--axis); }
.chart .gl { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .axis-line { stroke: var(--border); stroke-width: 1; }
.chart .series-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .pt { transition: opacity var(--dur-2); pointer-events: none; }
.chart .bar { transition: opacity var(--dur-2); }
.chart .bar:hover { opacity: 0.78; }
.chart .lbl { font-family: var(--font-ui); font-size: 10px; fill: var(--text-3); }
.chart .val { font-family: var(--font-num); font-size: 10.5px; fill: var(--text-2); }
.chart-legend { display: flex; gap: var(--s-5); flex-wrap: wrap; font-size: var(--t-xs); color: var(--text-2); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 8px; height: 8px; border-radius: 3px; }

/* 环形图 + 图例 */
.donut-wrap { display: flex; flex-direction: column; gap: var(--s-5); }
.donut { position: relative; display: grid; place-items: center; }
.donut__center {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  text-align: center;
}
.donut__center b {
  font-family: var(--font-num);
  font-size: var(--t-2xl);
  font-weight: var(--w-med);
  letter-spacing: -0.02em;
  color: var(--text-1);
}
.donut__center span { font-size: var(--t-2xs); color: var(--text-3); }
.legend { display: flex; flex-direction: column; gap: 2px; }
.legend__row {
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr) auto auto;
  align-items: center;
  gap: var(--s-3);
  padding: 5px 8px;
  margin: 0 -8px;
  border-radius: var(--r-xs);
  font-size: var(--t-xs);
  cursor: pointer;
  transition: background var(--dur-2);
}
.legend__row:hover { background: var(--surface-2); }
.legend__sw { width: 8px; height: 8px; border-radius: 2.5px; }
.legend__name { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend__val { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--text-1); }
.legend__pct { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--text-3); width: 40px; text-align: right; }

/* ---------- 分类排行条 ---------- */
.cat-list { display: flex; flex-direction: column; gap: var(--s-5); }
.cat {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px var(--s-4);
  cursor: pointer;
}
.cat__top { display: flex; align-items: center; gap: var(--s-3); font-size: var(--t-sm); color: var(--text-1); }
.cat__top .n { font-family: var(--font-num); font-size: var(--t-2xs); color: var(--text-4); width: 14px; }
.cat__val { font-family: var(--font-num); font-size: var(--t-sm); font-variant-numeric: tabular-nums; color: var(--text-1); text-align: right; }
.cat__val small { display: block; font-size: var(--t-2xs); color: var(--text-3); text-align: right; }
.cat__track { grid-column: 1 / -1; height: 6px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.cat__fill { height: 100%; border-radius: var(--r-pill); transition: width var(--dur-4) var(--ease-out); }
.cat:hover .cat__top { color: var(--primary-ink); }
.cat-list--lg .cat__track { height: 8px; }

/* 商家排行 */
.merchant { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-3) 0; }
.merchant__idx {
  display: grid; place-items: center;
  width: 20px; height: 20px;
  border-radius: 6px;
  background: var(--surface-3);
  color: var(--text-3);
  font-family: var(--font-num);
  font-size: 10.5px;
  flex: none;
}
.merchant:nth-child(1) .merchant__idx { background: var(--primary-soft); color: var(--primary-ink); }
.merchant__name { flex: 1; min-width: 0; font-size: var(--t-sm); color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.merchant__bar { width: 74px; height: 4px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; flex: none; }
.merchant__bar i { display: block; height: 100%; background: var(--primary); border-radius: inherit; opacity: 0.65; }
.merchant__amt { width: 74px; text-align: right; font-family: var(--font-num); font-size: var(--t-sm); font-variant-numeric: tabular-nums; color: var(--text-1); }
.merchant__cnt { width: 44px; text-align: right; font-size: var(--t-2xs); color: var(--text-4); }

/* 摘要 */
.summary-list { display: flex; flex-direction: column; gap: var(--s-5); counter-reset: s; }
.summary-item { display: flex; gap: var(--s-4); font-size: var(--t-sm); line-height: 1.75; color: var(--text-2); }
.summary-item::before {
  counter-increment: s;
  content: counter(s, decimal-leading-zero);
  flex: none;
  font-family: var(--font-num);
  font-size: var(--t-2xs);
  color: var(--primary);
  background: var(--primary-softer);
  border: 1px solid var(--primary-line);
  width: 24px; height: 24px;
  border-radius: 7px;
  display: grid; place-items: center;
  margin-top: 1px;
}
.summary-item b { color: var(--text-1); font-weight: var(--w-semi); font-family: var(--font-num); }

/* ---------- 导入向导 ---------- */
.wizard { display: flex; flex-direction: column; gap: var(--s-6); }
.wizard__bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.wizard__panel { padding: var(--s-8); }
.wizard__foot {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-5) var(--s-7);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 0 0 var(--r-lg) var(--r-lg);
}
.wizard__hint { font-size: var(--t-xs); color: var(--text-3); display: flex; align-items: center; gap: 6px; }

.upload-row { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) var(--s-5); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); }
.file-icon {
  display: grid; place-items: center;
  width: 38px; height: 38px; border-radius: var(--r-sm);
  background: var(--ok-soft); color: var(--ok); flex: none;
}
.file-meta { flex: 1; min-width: 0; }
.file-meta b { display: block; font-size: var(--t-sm); color: var(--text-1); font-weight: var(--w-med); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-meta span { font-size: var(--t-2xs); color: var(--text-3); font-family: var(--font-num); }

.kv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.kv { padding: var(--s-4) var(--s-5); background: var(--surface); }
.kv__k { font-size: var(--t-2xs); color: var(--text-3); }
.kv__v { margin-top: 2px; font-family: var(--font-num); font-size: var(--t-lg); color: var(--text-1); font-variant-numeric: tabular-nums; }
.kv__v small { font-family: var(--font-ui); font-size: var(--t-2xs); color: var(--text-3); margin-left: 3px; }

.map-row {
  display: grid;
  grid-template-columns: 132px minmax(0, 260px) 24px minmax(0, 1fr);
  align-items: center;
  gap: var(--s-4);
  padding: var(--s-3) 0;
  border-bottom: 1px dashed var(--border);
}
.map-row:last-child { border-bottom: 0; }
.map-row__std { display: flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: var(--text-1); }
.map-row__std .req { color: var(--danger); font-size: 10px; }
.map-row__arrow { display: grid; place-items: center; color: var(--text-4); }
.map-auto { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-2xs); color: var(--ok); }

.preview-table { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.preview-table .table th { background: var(--surface-2); }

.dup-row-badge { display: inline-flex; align-items: center; gap: 5px; }

/* 报告 */
.report-hero {
  display: flex; align-items: center; gap: var(--s-6);
  padding: var(--s-7);
  border-radius: var(--r-lg);
  background: radial-gradient(120% 150% at 0% 0%, var(--ok-soft), transparent 62%), var(--surface);
  border: 1px solid var(--border);
}
.report-hero__icon {
  display: grid; place-items: center;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--ok); color: #fff; flex: none;
  box-shadow: 0 10px 24px -12px var(--ok);
}
.report-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
.report-grid > div { background: var(--surface); padding: var(--s-5); }

/* ---------- 明细筛选 ---------- */
.filterbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s-3);
  padding: var(--s-5) var(--s-6);
}
.filterbar .input-group { width: 220px; }
.filterbar__more { margin-left: auto; display: flex; align-items: center; gap: var(--s-3); }
.summary-strip {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-6);
  padding: var(--s-4) var(--s-6);
  border-top: 1px solid var(--border);
  background: var(--surface-2);
  font-size: var(--t-xs);
  color: var(--text-3);
}
.summary-strip b { font-family: var(--font-num); font-size: var(--t-md); color: var(--text-1); font-variant-numeric: tabular-nums; margin-left: 5px; }
.summary-strip .sep { width: 1px; height: 14px; background: var(--border-2); }

.bulkbar {
  position: sticky;
  bottom: var(--s-5);
  z-index: 12;
  display: flex; align-items: center; gap: var(--s-4);
  margin: var(--s-5) var(--s-6) 0;
  padding: var(--s-3) var(--s-4) var(--s-3) var(--s-5);
  border-radius: var(--r-md);
  background: var(--surface-inv);
  color: #fff;
  box-shadow: var(--shadow-3);
  animation: toastIn var(--dur-3) var(--ease-out);
}
.bulkbar__count { font-size: var(--t-xs); }
.bulkbar__count b { font-family: var(--font-num); font-size: var(--t-md); }
.bulkbar .btn--ghost { color: rgba(255, 255, 255, 0.82); }
.bulkbar .btn--ghost:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
.bulkbar .btn--outline { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.24); color: #fff; }
.bulkbar .btn--outline:hover { background: rgba(255, 255, 255, 0.18); }
.bulkbar .btn--primary { background: #fff; color: var(--text-1); }

.pager { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-6); border-top: 1px solid var(--border); font-size: var(--t-xs); color: var(--text-3); }
.pager__nums { display: flex; gap: 2px; margin-left: auto; }
.pager__num {
  min-width: 28px; height: 28px;
  display: grid; place-items: center;
  border: 1px solid transparent; border-radius: var(--r-xs);
  background: transparent; color: var(--text-2); font-family: var(--font-num);
  font-size: var(--t-xs); cursor: pointer;
}
.pager__num:hover { background: var(--surface-3); }
.pager__num[aria-current="true"] { background: var(--primary-soft); color: var(--primary-ink); border-color: var(--primary-line); font-weight: var(--w-semi); }

/* ---------- 待确认队列 ---------- */
.pending-group {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: border-color var(--dur-2), box-shadow var(--dur-2);
}
.pending-group:hover { border-color: var(--border-2); }
.pending-group.is-checked { border-color: var(--primary-line); box-shadow: inset 3px 0 0 var(--primary); }
.pending-group__head {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-5);
  background: var(--surface-2);
  cursor: pointer;
}
.pending-group__name { font-size: var(--t-sm); font-weight: var(--w-med); color: var(--text-1); }
.pending-group__meta { font-size: var(--t-2xs); color: var(--text-3); }
.pending-group__amt { margin-left: auto; font-family: var(--font-num); font-size: var(--t-sm); color: var(--text-1); font-variant-numeric: tabular-nums; }
.pending-group__body { padding: var(--s-3) var(--s-5) var(--s-4); display: flex; flex-direction: column; gap: 2px; }
.pending-line { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-2) 0; font-size: var(--t-xs); color: var(--text-3); }
.pending-line__item { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.pending-line__amt { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--text-2); }
.assign-panel { position: sticky; top: calc(var(--top-h) + var(--s-5)); }

/* ---------- 规则 / 分类 ---------- */
.rule-kw { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--text-1); background: var(--surface-3); padding: 2px 6px; border-radius: 5px; }
.cat-tree { display: flex; flex-direction: column; }
.cat-tree__l1 { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) var(--s-5); border-bottom: 1px solid var(--border); cursor: pointer; }
.cat-tree__l1:hover { background: var(--surface-2); }
.cat-tree__l1.is-active { background: var(--primary-softer); box-shadow: inset 3px 0 0 var(--primary); }
.cat-tree__l1 b { font-size: var(--t-sm); }
.cat-tree__count { font-family: var(--font-num); font-size: var(--t-2xs); color: var(--text-3); }
.cat-l2-row { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-3) var(--s-5) var(--s-3) var(--s-10); border-bottom: 1px solid var(--border); font-size: var(--t-sm); }
.cat-l2-row:last-child { border-bottom: 0; }
.cat-l2-row:hover { background: var(--surface-2); }

/* ---------- 备份 / 设置 ---------- */
.setting-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 320px);
  gap: var(--s-6);
  align-items: start;
  padding: var(--s-6) 0;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: 0; }
.setting-row__title { font-size: var(--t-sm); font-weight: var(--w-med); color: var(--text-1); display: flex; align-items: center; gap: var(--s-3); }
.setting-row__desc { font-size: var(--t-xs); color: var(--text-3); margin-top: 3px; line-height: 1.65; max-width: 52ch; }
.setting-row__ctl { display: flex; align-items: center; gap: var(--s-3); justify-content: flex-end; }
.setting-row__ctl .input, .setting-row__ctl .select { width: 100%; }
.backup-file { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) 0; border-bottom: 1px solid var(--border); font-size: var(--t-sm); }
.backup-file:last-child { border-bottom: 0; }

/* ---------- 帮助 ---------- */
.help-toc { position: sticky; top: calc(var(--top-h) + var(--s-5)); display: flex; flex-direction: column; gap: 2px; }
.help-toc a {
  padding: 7px var(--s-4);
  border-radius: var(--r-xs);
  color: var(--text-2);
  font-size: var(--t-xs);
  border-left: 2px solid transparent;
}
.help-toc a:hover { background: var(--surface-3); color: var(--text-1); text-decoration: none; }
.help-toc a.is-active { color: var(--primary-ink); background: var(--primary-softer); border-left-color: var(--primary); font-weight: var(--w-med); }
.help-prose p { font-size: var(--t-sm); color: var(--text-2); line-height: 1.9; margin: var(--s-4) 0; }
.help-prose p:first-child { margin-top: 0; }
.help-prose > *:last-child { margin-bottom: 0; }
.help-prose h3 { font-size: var(--t-md); font-weight: var(--w-semi); margin: var(--s-6) 0 var(--s-3); }
.help-prose ol { counter-reset: h; padding-left: 0; }
.help-prose ol > li {
  counter-increment: h;
  position: relative;
  padding-left: var(--s-9);
  margin: var(--s-4) 0;
  font-size: var(--t-sm);
  color: var(--text-2);
  line-height: 1.8;
}
.help-prose ol > li::before {
  content: counter(h);
  position: absolute; left: 0; top: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary-ink);
  font-family: var(--font-num); font-size: 10.5px;
  display: grid; place-items: center;
}

/* ---------- 设计系统页 ---------- */
.ds-section + .ds-section { margin-top: var(--s-10); }
.ds-head { display: flex; align-items: flex-end; gap: var(--s-4); margin-bottom: var(--s-5); }
.ds-head h2 { font-size: var(--t-lg); font-weight: var(--w-semi); letter-spacing: -0.01em; }
.ds-head p { font-size: var(--t-xs); color: var(--text-3); }
.swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: var(--s-4); }
.swatch { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.swatch__chip { height: 58px; box-shadow: inset 0 0 0 1px rgba(60, 40, 50, 0.07); }
.swatch__meta { padding: var(--s-3); font-size: 10.5px; line-height: 1.5; }
.swatch__meta b { display: block; font-size: var(--t-2xs); color: var(--text-1); font-weight: var(--w-med); }
.swatch__meta code { font-family: var(--font-mono); font-size: 10px; color: var(--text-3); }
.swatch__meta .cr { color: var(--text-4); }

.spec-table { width: 100%; font-size: var(--t-xs); border-collapse: collapse; }
.spec-table th {
  text-align: left; padding: 8px 10px; font-size: 10.5px; letter-spacing: 0.06em;
  color: var(--text-3); border-bottom: 1px solid var(--border-2); font-weight: var(--w-semi); white-space: nowrap;
}
.spec-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: top; }
.spec-table code { font-family: var(--font-mono); font-size: 10.5px; color: var(--primary-ink); }
.spec-table tbody tr:hover { background: var(--surface-2); }
.type-row { display: flex; align-items: baseline; gap: var(--s-5); padding: var(--s-4) 0; border-bottom: 1px solid var(--border); }
.type-row__sample { flex: 1; min-width: 0; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type-row__meta { width: 150px; flex: none; font-family: var(--font-mono); font-size: 10px; color: var(--text-3); text-align: right; }
.gallery { display: flex; flex-wrap: wrap; gap: var(--s-4); align-items: center; }
.gallery--col { flex-direction: column; align-items: stretch; }
.state-grid { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: var(--s-3) var(--s-5); align-items: center; font-size: var(--t-2xs); color: var(--text-3); }
.spacing-demo { display: flex; align-items: flex-end; gap: var(--s-3); }
.spacing-demo div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9.5px; color: var(--text-4); font-family: var(--font-mono); }
.spacing-demo i { display: block; background: var(--primary-soft); border: 1px solid var(--primary-line); border-radius: 3px; width: 100%; }
.radius-demo { display: flex; gap: var(--s-4); flex-wrap: wrap; }
.radius-demo > div { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.radius-demo i { display: block; width: 56px; height: 56px; background: var(--surface-2); border: 1px solid var(--border-2); }
.radius-demo span { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-4); }

/* ---------- 原始库 ---------- */
.month-list { display: flex; flex-direction: column; gap: 2px; max-height: 520px; overflow-y: auto; }
.month-item {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r-xs);
  background: transparent; border: 0;
  font-size: var(--t-sm); color: var(--text-2); cursor: pointer; text-align: left;
  transition: background var(--dur-2);
}
.month-item:hover { background: var(--surface-3); }
.month-item[aria-current="true"] { background: var(--primary-soft); color: var(--primary-ink); font-weight: var(--w-med); }
.month-item__n { margin-left: auto; font-family: var(--font-num); font-size: var(--t-2xs); color: var(--text-3); }

.batch-trace {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: var(--t-xs);
  color: var(--text-2);
}

/* ---------- 响应式 ---------- */
@media (max-width: 1240px) {
  .c-3, .c-4, .c-5 { grid-column: span 6; }
  .c-7, .c-8, .c-9 { grid-column: span 12; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .overview { grid-template-columns: 1fr; gap: var(--s-5); }
  .overview__stats { padding-left: 0; border-left: 0; border-top: 1px dashed var(--border-2); padding-top: var(--s-4); grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 1080px) {
  :root { --rail-w: 72px; }
  .brand__text, .nav__label, .nav__item span, .rail__card, .rail__ver { display: none; }
  .brand { justify-content: center; }
  .nav__item { justify-content: center; padding: 10px 0; }
  .nav__group + .nav__group { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
  .nav__item[aria-current="page"]::before { left: -3px; }
  .nav__badge { position: absolute; top: 3px; right: 6px; margin: 0; }
  .rail { padding: var(--s-6) var(--s-3); }
  .brand { padding: 0; }
  .topbar, .view { padding-left: var(--s-6); padding-right: var(--s-6); }
  .setting-row { grid-template-columns: 1fr; gap: var(--s-3); }
  .setting-row__ctl { justify-content: flex-start; }
}
@media (max-width: 760px) {
  .grid.g-12 > * { grid-column: span 12 !important; }
  .kpi-grid, .report-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .overview__stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .view { padding: var(--s-6) var(--s-5) var(--s-12); }
  .page-head { align-items: flex-start; }
  .steps { overflow-x: auto; }
  .step__label { display: none; }
  .map-row { grid-template-columns: 1fr; gap: var(--s-2); }
  .map-row__arrow { display: none; }
  .topbar__date { display: none; }
}

/* ===== 04 extra ===== */
/* ============================================================
   04 · 设计系统页与主题预览专用样式
   ============================================================ */

.tp {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--bg);
  transition: all var(--dur-3) var(--ease);
}
.tp__bar {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: var(--t-xs);
}
.tp__bar b { font-weight: var(--w-semi); color: var(--text-1); }
.tp__bar .badge { margin-left: auto; }
.tp__sw { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.tp__body { padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-4); }
.tp__kpi {
  padding: var(--s-4) var(--s-5);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: radial-gradient(120% 160% at 0% 0%, var(--primary-soft), transparent 60%), var(--surface);
}
.tp__kpi span { font-size: var(--t-2xs); color: var(--text-3); display: block; }
.tp__kpi b {
  font-family: var(--font-num);
  font-size: var(--t-2xl);
  font-weight: var(--w-med);
  letter-spacing: -0.02em;
  color: var(--text-1);
  display: inline-block;
  margin-right: var(--s-2);
}
.tp__bars { display: flex; align-items: flex-end; gap: 5px; height: 42px; }
.tp__bars i { flex: 1; border-radius: 3px 3px 0 0; background: var(--primary); opacity: 0.75; }
.tp__bars i:nth-child(even) { opacity: 0.35; }
.tp__chips { display: flex; gap: 6px; flex-wrap: wrap; }

.ds-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-6); }
@media (max-width: 900px) { .ds-grid-2 { grid-template-columns: 1fr; } }

.token-table { width: 100%; border-collapse: collapse; font-size: var(--t-xs); }
.token-table th {
  text-align: left; padding: 8px 10px; font-size: 10.5px; letter-spacing: .06em;
  color: var(--text-3); font-weight: var(--w-semi); border-bottom: 1px solid var(--border-2); white-space: nowrap;
}
.token-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: middle; }
.token-table tr:hover { background: var(--surface-2); }
.token-table code { font-family: var(--font-mono); font-size: 10.5px; color: var(--primary-ink); }
.token-table th:nth-child(1) { width: 196px; }
.token-table th:nth-child(2), .token-table th:nth-child(3) { width: 58px; }
.token-table th:nth-child(4) { width: 176px; }
.token-table .cell-sw { width: 34px; }
.token-table .cell-sw i { display: block; width: 22px; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
.token-table .hex { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-3); }
.cr {
  display: inline-block; padding: 1px 6px; border-radius: 20px;
  font-family: var(--font-mono); font-size: 10px;
  background: var(--surface-3); color: var(--text-3);
}
.cr--ok { background: var(--ok-soft); color: var(--ok); }
.cr--warn { background: var(--warn-soft); color: var(--warn); }

.demo-block {
  padding: var(--s-5);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface-2);
}
.demo-block__label { font-size: 10.5px; letter-spacing: .08em; color: var(--text-3); margin-bottom: var(--s-4); text-transform: uppercase; }
.state-matrix { display: grid; grid-template-columns: 76px repeat(5, minmax(0, 1fr)); gap: var(--s-3); align-items: center; }
.state-matrix > .h { font-size: 10px; letter-spacing: .06em; color: var(--text-3); text-align: center; }
.state-matrix > .r { font-size: 10.5px; color: var(--text-2); }

/* 段落式柱块 */
.bblocks { display: flex; align-items: flex-end; gap: var(--s-4); height: 178px; margin-top: var(--s-4); }
.bblock { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 7px; }
.bblock__v { font-family: var(--font-num); font-size: var(--t-xs); color: var(--text-2); font-variant-numeric: tabular-nums; }
.bblock__bar { width: 100%; max-width: 52px; border-radius: 8px 8px 3px 3px; transition: opacity var(--dur-2); }
.bblock:hover .bblock__bar { opacity: 0.62 !important; }
.bblock__l { font-size: var(--t-2xs); color: var(--text-3); }

/* 图表内联说明条 */
.chart-strip {
  display: flex; flex-wrap: wrap; gap: var(--s-7);
  margin-top: var(--s-5);
  padding-top: var(--s-5);
  border-top: 1px solid var(--border);
}
.chart-strip > div { min-width: 96px; }
.chart-strip dt { font-size: var(--t-2xs); color: var(--text-3); }
.chart-strip dd {
  margin: 2px 0 0; font-family: var(--font-num); font-size: var(--t-lg);
  color: var(--text-1); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}
.chart-strip dd small { font-family: var(--font-ui); font-size: var(--t-2xs); color: var(--text-3); margin-left: 3px; }
</style>
</head>
