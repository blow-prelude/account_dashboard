/* ============================================================
   06 · 轻量 SVG 图表（无第三方依赖，全部由后端数据驱动）
   ============================================================ */

function niceMax(v) {
  if (v <= 0) return 10;
  const pow = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / pow;
  const steps = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (const s of steps) if (n <= s) return s * pow;
  return 10 * pow;
}

/* 让刻度落在整数上（避免 63 / 188 这类读数） */
function niceTicks(v, count = 4) {
  const raw = v / count;
  if (raw <= 0) return { max: count, step: 1 };
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / pow;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * pow;
  return { max: step * count, step };
}

function compact(v) {
  if (v >= 10000) return (v / 10000).toFixed(v % 10000 === 0 ? 0 : 1) + ' 万';
  return fmt(v, v % 1 === 0 ? 0 : 0);
}

function smooth(pts) {
  if (!pts.length) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1];
    const [x1, y1] = pts[i];
    const cx = (x0 + x1) / 2;
    d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  return d;
}

/* ---------- 支出趋势（面积 + 收入到账标记） ---------- */
function trendChart(p, id) {
  if (p.trend.income) return compareBars(p.trend.labels, [
    { name: '收入', color: 'var(--chart-4)', values: p.trend.income },
    { name: '支出', color: 'var(--chart-1)', values: p.trend.expense },
  ], { h: 250, gap: 0.34 });

  const W = 800, H = 306;
  const pad = { l: 52, r: 18, t: 38, b: 30 };
  const labels = p.trend.labels;
  const vals = p.trend.expense;
  const tick = niceTicks(Math.max(...vals) * 1.08, 4);
  const max = tick.max;
  const iw = W - pad.l - pad.r;
  const ih = H - pad.t - pad.b;
  const X = (i) => pad.l + (i * iw) / (labels.length - 1);
  const Y = (v) => pad.t + ih - (v / max) * ih;
  const pts = vals.map((v, i) => [X(i), Y(v)]);
  const line = smooth(pts);
  const area = `${line} L${X(vals.length - 1)},${pad.t + ih} L${pad.l},${pad.t + ih} Z`;

  let grid = '';
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (max / ticks) * i;
    const y = Y(v);
    grid += `<line class="gl" x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W - pad.r}" y2="${y.toFixed(1)}"/>`;
    grid += `<text x="${pad.l - 10}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${compact(v)}</text>`;
  }

  const step = Math.ceil(labels.length / 7);
  let xlab = '';
  labels.forEach((l, i) => {
    if (i % step !== 0 && i !== labels.length - 1) return;
    xlab += `<text class="lbl" x="${X(i).toFixed(1)}" y="${H - 10}" text-anchor="middle">${l}</text>`;
  });

  let marks = '';
  (p.trend.marks || []).forEach((m) => {
    const x = X(m.i);
    const label = `收入 ${fmt(m.value, 0)}`;
    const w = 78, h = 20;
    let bx = Math.min(Math.max(x - w / 2, pad.l), W - pad.r - w);
    marks += `<line x1="${x.toFixed(1)}" y1="${pad.t - 4}" x2="${x.toFixed(1)}" y2="${(pad.t + ih).toFixed(1)}"
      stroke="var(--chart-4)" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/>`;
    marks += `<rect x="${bx.toFixed(1)}" y="6" width="${w}" height="${h}" rx="10" fill="var(--chart-4)" opacity=".14"/>`;
    marks += `<circle cx="${(bx + 11).toFixed(1)}" cy="16" r="3" fill="var(--chart-4)"/>`;
    marks += `<text x="${(bx + 19).toFixed(1)}" y="19.5" style="fill:var(--text-2);font-size:10px;font-family:var(--font-ui)">${label}</text>`;
  });

  let hits = '';
  pts.forEach(([x, y], i) => {
    const w = iw / (labels.length - 1);
    hits += `<rect class="hit" data-i="${i}" x="${(x - w / 2).toFixed(1)}" y="${pad.t}" width="${w.toFixed(1)}" height="${ih}"
      data-tip="${labels[i]} · 支出 ¥${fmt(vals[i])}"/>`;
    hits += `<circle class="pt" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--surface)" stroke="var(--chart-1)" stroke-width="1.8" opacity="0"/>`;
  });

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${p.trendTitle}趋势图">
    <defs>
      <linearGradient id="g-${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--chart-1)" stop-opacity=".26"/>
        <stop offset="100%" stop-color="var(--chart-1)" stop-opacity=".01"/>
      </linearGradient>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#g-${id})"/>
    <path class="series-line" d="${line}" stroke="var(--chart-1)"/>
    ${marks}
    ${hits}
    ${xlab}
  </svg>`;
}

/* ---------- 分组柱状（收支对比） ---------- */
function compareBars(labels, series, opt = {}) {
  const W = opt.w || 780, H = opt.h || 260;
  const small = W < 520;
  const pad = { l: small ? 42 : 52, r: 14, t: 24, b: 30 };
  const fs = small ? 12 : 10.5;
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const all = series.flatMap((s) => s.values).filter((v) => v != null);
  const tick = niceTicks(Math.max(...all) * 1.08, 4);
  const max = tick.max;
  const Y = (v) => pad.t + ih - (v / max) * ih;
  const n = labels.length;
  const groupW = iw / n;
  const gapRatio = opt.gap != null ? opt.gap : 0.3;
  const bw = (groupW * (1 - gapRatio)) / series.length;

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, y = Y(v);
    grid += `<line class="gl" x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W - pad.r}" y2="${y.toFixed(1)}"/>`;
    grid += `<text x="${pad.l - 9}" y="${(y + fs * 0.35).toFixed(1)}" text-anchor="end" style="font-size:${fs}px">${compact(v)}</text>`;
  }

  let bars = '', xlab = '';
  labels.forEach((l, i) => {
    const gx = pad.l + groupW * i;
    const empty = series.every((s) => s.values[i] == null);
    series.forEach((s, si) => {
      const v = s.values[i];
      if (v == null) return;
      const h = Math.max(ih - (Y(v) - pad.t), 1.5);
      const x = gx + groupW * (gapRatio / 2) + bw * si;
      bars += `<rect class="bar" x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw - 1.5).toFixed(1)}" height="${h.toFixed(1)}"
        rx="${Math.min(4, bw / 3).toFixed(1)}" fill="${s.color}" data-tip="${l} · ${s.name} ¥${fmt(v)}"/>`;
    });
    xlab += `<text class="lbl" x="${(gx + groupW / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle"
      style="font-size:${fs}px;${empty ? 'opacity:.45' : ''}">${l}</text>`;
  });

  return `<div class="chart-legend" style="margin-bottom:6px">
      ${series.map((s) => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="收支对比柱状图">
      ${grid}
      <line class="axis-line" x1="${pad.l}" y1="${pad.t + ih}" x2="${W - pad.r}" y2="${pad.t + ih}"/>
      ${bars}${xlab}
    </svg>`;
}

/* ---------- 环形图 ---------- */
function donutChart(items, total, centerLabel) {
  const S = 196, cx = S / 2, cy = S / 2, r = 74, sw = 20;
  const gap = 0.038;
  let a = 0, paths = '', hits = '';
  const polar = (rad, ang) => [cx + rad * Math.sin(ang), cy - rad * Math.cos(ang)];
  items.forEach((it, i) => {
    const sweep = (it.value / total) * Math.PI * 2;
    const a0 = a + gap / 2, a1 = a + sweep - gap / 2;
    if (a1 > a0) {
      const [x0, y0] = polar(r, a0);
      const [x1, y1] = polar(r, a1);
      const large = a1 - a0 > Math.PI ? 1 : 0;
      paths += `<path d="M${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)}"
        fill="none" stroke="${it.color}" stroke-width="${sw}" stroke-linecap="round"
        class="seg" data-tip="${it.name} · ¥${fmt(it.value)} · ${((it.value / total) * 100).toFixed(1)}%"/>`;
    }
    a += sweep;
  });
  return `<svg class="chart" viewBox="0 0 ${S} ${S}" role="img" aria-label="支出分类占比">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${sw}"/>
    ${paths}
    <text x="${cx}" y="${cy - 4}" text-anchor="middle"
      style="font-family:var(--font-num);font-size:19px;fill:var(--text-1);letter-spacing:-.02em">${centerLabel}</text>
    <text x="${cx}" y="${cy + 14}" text-anchor="middle"
      style="font-family:var(--font-ui);font-size:10px;fill:var(--text-3)">总支出</text>
  </svg>`;
}

/* ---------- 迷你折线 ---------- */
function sparkline(values, color = 'var(--chart-1)', w = 92, h = 30) {
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [(i / (values.length - 1)) * w, h - 3 - ((v - min) / span) * (h - 6)]);
  const d = smooth(pts);
  return `<svg class="kpi__spark" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
    <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="2" fill="${color}"/>
  </svg>`;
}

/* ---------- 迷你柱（分析页趋势） ---------- */
function miniBars(values, color = 'var(--chart-1)', w = 640, h = 120) {
  const n = values.length, bw = w / n * 0.46, gap = w / n;
  const max = niceMax(Math.max(...values));
  let out = '';
  values.forEach((v, i) => {
    const bh = (v / max) * (h - 16);
    out += `<rect class="bar" x="${(i * gap + (gap - bw) / 2).toFixed(1)}" y="${(h - 16 - bh).toFixed(1)}"
      width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${color}" opacity="${i === n - 1 ? 1 : .32}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-hidden="true">${out}</svg>`;
}

/* ---------- 行内迷你折线（表格里用） ---------- */
function spark(values, color = 'var(--chart-1)', w = 120, h = 30) {
  const max = Math.max(...values), min = Math.min(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [(i / (values.length - 1)) * (w - 6) + 3, h - 4 - ((v - min) / span) * (h - 8)]);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" aria-hidden="true">
    <path d="${smooth(pts)}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="2.2" fill="${color}"/>
  </svg>`;
}

/* ---------- 段落式柱块（近 6 个月走势） ---------- */
function barBlocks(items, color = 'var(--primary)') {
  const max = Math.max(...items.map((i) => i.value));
  return `<div class="bblocks">
    ${items.map((it, i) => `<div class="bblock">
      <span class="bblock__v">${fmt(it.value, 0)}</span>
      <span class="bblock__bar" style="height:${Math.max(8, (it.value / max) * 118).toFixed(0)}px;background:${color};opacity:${i === items.length - 1 ? 1 : 0.32}"></span>
      <span class="bblock__l">${it.label}</span>
    </div>`).join('')}
  </div>`;
}

/* ---------------- 4. 流水明细 ---------------- */
function txRows() {
  const f = state.txFilter;
  const list = TX.filter((t) => {
    if (f.status !== 'all' && t.status !== f.status) return false;
    if (f.dir !== 'all' && t.dir !== f.dir) return false;
    if (f.cat !== 'all' && f.cat !== '全部分类' && !t.l2.startsWith(f.cat)) return false;
    if (f.q && !(t.cp + t.item + t.l2).toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  });
  const dir = state.sort.dir === 'asc' ? 1 : -1;
  return list.sort((a, b) => {
    if (state.sort.key === 'amt') return (Math.abs(a.amt) - Math.abs(b.amt)) * dir;
    return a.time.localeCompare(b.time) * dir;
  });
}

function lum(hex) {
  const c = hex.replace('#', '');
  const v = [0, 2, 4].map((i) => parseInt(c.substr(i, 2), 16) / 255)
    .map((x) => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function cr(a, b) {
  const l1 = Math.max(lum(a), lum(b)), l2 = Math.min(lum(a), lum(b));
  return (l1 + 0.05) / (l2 + 0.05);
}

/* ---------- 主题 ---------- */
function setTheme(t, silent) {
  state.theme = t;
  document.documentElement.dataset.theme = t;
  localStorage.setItem('fd-theme', t);
  $$('[data-theme-set]').forEach((el) => el.setAttribute('aria-pressed', String(el.dataset.themeSet === t)));
  if (!silent) {
    if (state.route === 'ds' || state.route === 'settings') render();
    showToast(t === 'pink' ? '已切换到「玫瑰粉」主题' : '已切换到「天青蓝」主题', 'ok');
  }
}

let lastRoute = null;
function render() {
  const r = ROUTES.find((x) => x.k === state.route) || ROUTES[0];
  renderRail();
  renderTopbar();
  $('#view').innerHTML = r.f();
  if (lastRoute !== state.route) {
    window.scrollTo(0, 0);
    lastRoute = state.route;
  }
  if (state.focus === 'q') {
    const el = $('[data-filter="q"]');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    state.focus = null;
  }
}

function go(route) {
  if (!ROUTES.some((r) => r.k === route)) return;
  state.route = route;
  if (location.hash.slice(1) !== route) history.replaceState(null, '', '#' + route);
  render();
}

/* ---------- 轻提示 ---------- */
function showToast(msg, kind) {
  const box = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.innerHTML = `<i></i><span>${msg}</span>`;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s, transform .3s'; el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

/* ---------- 弹层 ---------- */
function openLayer(html) {
  const layer = $('#layer');
  layer.innerHTML = html;
  document.body.style.overflow = 'hidden';
  const focusable = layer.querySelector('.modal, .drawer');
  if (focusable) focusable.setAttribute('tabindex', '-1');
  setTimeout(() => focusable && focusable.focus(), 30);
}
function closeLayer() {
  $('#layer').innerHTML = '';

}

/* ---------- 事件 ---------- */
document.addEventListener('click', (e) => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }

  const th = e.target.closest('[data-theme-set]');
  if (th) { setTheme(th.dataset.themeSet); return; }

  const per = e.target.closest('[data-period]');
  if (per) { state.period = per.dataset.period; render(); return; }

  const mon = e.target.closest('[data-month]');
  if (mon) { state.rawMonth = mon.dataset.month; render(); return; }

  const catEl = e.target.closest('[data-cat]');
  if (catEl && !e.target.closest('[data-cat-l1]')) { state.cat = catEl.dataset.cat; render(); return; }

  const catL1 = e.target.closest('[data-cat-l1]');
  if (catL1 && !e.target.closest('[data-act="toggle"]')) { state.catL1 = catL1.dataset.catL1; render(); return; }

  const dirChip = e.target.closest('[data-filter="dir"]');
  if (dirChip) { state.txFilter.dir = dirChip.dataset.val; render(); return; }

  const sortEl = e.target.closest('[data-sort]');
  if (sortEl) {
    const k = sortEl.dataset.sort;
    state.sort = { key: k, dir: state.sort.key === k && state.sort.dir === 'desc' ? 'asc' : 'desc' };
    render(); return;
  }

  const actEl = e.target.closest('[data-act]');
  if (!actEl) {
    const row = e.target.closest('tr[data-id]');
    if (row && $('#pending-body') === null) openTx(row.dataset.id);
    return;
  }
  const act = actEl.dataset.act;

  switch (act) {
    case 'toast': showToast(actEl.dataset.msg || '已完成'); break;
    case 'toast-close': closeLayer(); showToast(actEl.dataset.msg || '已完成', 'ok'); break;
    case 'toggle': {
      const on = actEl.getAttribute('aria-checked') === 'true';
      actEl.setAttribute('aria-checked', String(!on));
      break;
    }
    case 'rule-toggle': {
      const i = +actEl.dataset.i;
      RULES[i].on = !RULES[i].on;
      actEl.setAttribute('aria-checked', String(RULES[i].on));
      showToast(RULES[i].on ? `已启用「${RULES[i].kw}」` : `已停用「${RULES[i].kw}」，新导入不再套用`);
      break;
    }
    case 'close-layer': {
      /* 点遮罩才关闭；点面板内部不关闭 */
      if (actEl.classList.contains('overlay') && e.target.closest('.modal, .drawer')) break;
      closeLayer();
      break;
    }
    case 'open-tx': openTx(actEl.dataset.id); break;
    case 'save-tx': closeLayer(); showToast('已保存分类与备注（人工修正不会被重算覆盖）', 'ok'); break;
    case 'toggle-exclude': closeLayer(); showToast('已标记为「已排除」，不再计入任何收支统计'); break;
    case 'reset-filter': state.txFilter = { status: 'all', dir: 'all', q: '', cat: 'all' }; render(); break;
    case 'clear-sel': state.txSel.clear(); render(); break;
    case 'bulk-cat': showToast('批量改分类：已选 ' + state.txSel.size + ' 笔（示例）'); break;
    case 'bulk-rule': showToast('已生成规则「按对方自动归类」，后续导入生效', 'ok'); break;
    case 'upload': simulateUpload(); break;
    case 'reset-upload': state.uploaded = false; render(); break;
    case 'w-next': state.wStep = Math.min(5, state.wStep + 1); render(); break;
    case 'w-prev': state.wStep = Math.max(1, state.wStep - 1); render(); break;
    case 'force-new': mForceNew(); break;
    case 'force-ok': closeLayer(); showToast('已标记「强制新增」，入库时按新增处理并留痕', 'ok'); break;
    case 'confirm-import': if (!state.importing) simulateImport(); break;
    case 'pick-group': {
      const box = actEl.closest('.pending-group');
      const cb = box.querySelector('input[type=checkbox]');
      cb.checked = !cb.checked;
      box.classList.toggle('is-checked', cb.checked);
      const n = $$('#pending-body .pending-group input:checked').length;
      const c = $('#pick-count'); if (c) c.textContent = n;
      break;
    }
    case 'apply-pending': {
      const picked = $$('#pending-body .pending-group').filter((g) => g.querySelector('input').checked);
      if (!picked.length) { showToast('请先勾选要处理的流水', 'warn'); break; }
      picked.forEach((g) => state.pendingDone.add(+g.dataset.group));
      render();
      const left = $$('#pending-body .pending-group').length;
      showToast(`已处理 ${picked.length} 组${left ? '，剩余 ' + left + ' 组待确认' : '，队列已清空'}`, 'ok');
      break;
    }
    case 'drop': showToast('已丢弃批次并删除缓冲区文件（示例）'); break;
    case 'recalc': mRecalc(); break;
    case 'recalc-ok': closeLayer(); showToast('重算完成：更新 124 条，人工修正 4 条未重算', 'ok'); break;
    case 'add-rule': mAddRule(); break;
    case 'disable-cat': mDisableCat(actEl.dataset.name, actEl.dataset.count); break;
    case 'restore': mRestore(); break;
    case 'restore-ok': closeLayer(); showToast('恢复完成，已按备份重建数据库（示例）', 'ok'); break;
    case 'backup': showToast('正在备份数据库到 D:\\finance-data\\backups\\（示例）', 'ok'); break;
    case 'migrate': mMigrate(); break;
    case 'save-settings': showToast('保存被拒绝：数据目录不能指向网络位置', 'warn'); break;
    case 'modal-demo': modal({
      title: '这是一个标准弹窗',
      sub: '用于二次确认与轻表单，最大宽度 560px',
      body: `<p class="small muted" style="line-height:1.9;margin-bottom:14px">弹窗出现时背景模糊 3px，按 Esc 或点击遮罩关闭。破坏性操作会把主按钮换成 danger 变体，并要求二次确认。</p>
        <div class="field"><label class="field__label">备注</label><input class="input" placeholder="可选"></div>`,
      foot: `<button class="btn btn--ghost" data-act="close-layer">取消</button><button class="btn btn--primary" data-act="close-layer">确定</button>`,
    }); break;
    case 'drawer-demo': drawer({
      title: '抽屉面板',
      sub: '右侧 480px，用于详情与轻编辑',
      body: `<p class="small muted" style="line-height:1.9">抽屉适合「不离开列表上下文」的查看与编辑，例如流水详情、批次追溯。抽屉内可以再叠一层弹窗做确认。</p>`,
      foot: `<button class="btn btn--ghost" data-act="close-layer">关闭</button>`,
    }); break;
    default: break;
  }
});

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.filter === 'status') { state.txFilter.status = el.value; render(); }
  if (el.dataset.filter === 'cat') { state.txFilter.cat = el.value; render(); }

  /* 复选：明细行选择 / 全选 / 待确认分组 */
  if (el.dataset.act === 'sel-row') {
    const id = el.dataset.id;
    if (el.checked) state.txSel.add(id); else state.txSel.delete(id);
    render();
  }
  if (el.dataset.act === 'sel-all') {
    state.txSel.clear();
    if (el.checked) txRows().forEach((t) => state.txSel.add(t.id));
    render();
  }
  if (el.dataset.act === 'pick-cb') {
    const box = el.closest('.pending-group');
    box.classList.toggle('is-checked', el.checked);
    const n = $$('#pending-body .pending-group input:checked').length;
    const c = $('#pick-count'); if (c) c.textContent = n;
  }
});

document.addEventListener('input', (e) => {
  if (e.target.dataset.filter === 'q') {
    state.txFilter.q = e.target.value;
    state.focus = 'q';
    render();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLayer();
});

/* ---------- 图表 tooltip ---------- */
const tip = { el: null, raf: 0 };
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-tip]');
  if (!el) {
    if (tip.el) tip.el.classList.remove('is-on');
    $$('.chart .pt').forEach((p) => (p.style.opacity = '0'));
    return;
  }
  tip.el = tip.el || $('#tip');
  tip.el.innerHTML = el.dataset.tip;
  tip.el.classList.add('is-on');
  tip.el.style.left = e.clientX + 'px';
  tip.el.style.top = e.clientY + 'px';
  if (el.classList.contains('hit')) {
    const i = el.dataset.i;
    const svg = el.closest('svg');
    if (svg) {
      svg.querySelectorAll('.pt').forEach((p) => (p.style.opacity = p.dataset.i === i ? '1' : '0'));
    }
  }
});

/* ---------- 启动 ---------- */
const sp = new URLSearchParams(location.search);
const qTheme = sp.get('theme');
if (qTheme === 'pink' || qTheme === 'sky') state.theme = qTheme;
const qStep = Number(sp.get('step'));            /* 演示用：直接跳到导入向导某一步 */
if (qStep >= 1 && qStep <= 5) { state.wStep = qStep; state.uploaded = qStep > 1; }
const qPeriod = sp.get('period');                /* 演示用：指定统计周期 */
if (P[qPeriod]) state.period = qPeriod;
document.documentElement.dataset.theme = state.theme;
const initial = decodeURIComponent(location.hash.slice(1));
if (ROUTES.some((r) => r.k === initial)) state.route = initial;
window.addEventListener('hashchange', () => {
  const k = decodeURIComponent(location.hash.slice(1));
  if (ROUTES.some((r) => r.k === k) && k !== state.route) { state.route = k; render(); }
});
render();
</script>
</body>
</html>
